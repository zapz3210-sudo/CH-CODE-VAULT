<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CinderHex Code Vault</title>
<style>
:root{--bg:#0a0c12;--panel:#111622;--panel2:#171e2d;--line:#273247;--text:#f4f7ff;--muted:#a5b1c7;--accent:#ff623f;--accent2:#ff9a54;--good:#68e0ad;--bad:#ff7d87}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2132 0%,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{border-bottom:1px solid var(--line);background:#0b0e16d9;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.wrap{width:min(1080px,calc(100% - 32px));margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.2px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ffb05c);color:#1a1010;font-weight:1000;font-size:21px;box-shadow:0 6px 24px #ff623f33}
button,input,textarea,select{font:inherit}button{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}button:hover{border-color:#ff896f;transform:translateY(-1px)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ff9a5477;outline-offset:2px}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#1b1010}.quiet{background:transparent}.danger{color:#ff9da4;border-color:#6b303b}.small{font-size:13px;padding:7px 10px}
.hero{padding:46px 0 26px}.eyebrow{color:var(--accent2);font-size:12px;letter-spacing:2px;font-weight:900;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.04;letter-spacing:-1.8px;margin:10px 0 14px}.hero h1 span{color:var(--accent2)}.hero p{max-width:660px;color:var(--muted);margin:0}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 18px}.field{background:#0e1320;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:12px 14px;min-width:0}.search{flex:1;min-width:220px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.pill{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px;padding-bottom:48px}.code-card{background:linear-gradient(145deg,#151c2a,#101520);border:1px solid var(--line);border-radius:17px;padding:18px;min-width:0;transition: transform 0.1s;}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.code-card h2{font-size:19px;margin:0 0 5px;overflow-wrap:anywhere}.category{font-size:12px;color:var(--accent2);font-weight:800;letter-spacing:.5px}.description{color:var(--muted);font-size:14px;min-height:42px;margin:12px 0}.code-box{position:relative;background:#090d15;border:1px solid #29344a;border-radius:10px;padding:13px 12px;color:#e6edff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;white-space:pre-wrap;margin:14px 0; max-height: 250px; overflow-y: auto;}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.count{font-size:12px;color:var(--muted)}.empty{border:1px dashed var(--line);border-radius:15px;text-align:center;padding:38px;color:var(--muted);grid-column:1/-1}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:20px 0 30px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eafbf3;color:#10261d;border-radius:999px;padding:11px 17px;font-weight:800;box-shadow:0 8px 35px #0007;z-index:20;max-width:calc(100% - 24px);text-align:center;transition: opacity 0.3s; opacity: 1;}
.toast.hidden{opacity: 0; pointer-events: none;}

/* Animations */
@keyframes shake {
  0%, 100% {transform: translate(0,0);}
  25% {transform: translate(-6px, 6px);}
  50% {transform: translate(6px, -6px);}
  75% {transform: translate(-6px, -6px);}
}
.anim-shake { animation: shake 0.3s ease-in-out; }
@keyframes flashScreen {
  0% {background-color: #ffffff;}
  100% {background-color: var(--bg);}
}
.anim-flash { animation: flashScreen 0.4s ease-out; }
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  font-size: 24px;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  100% { opacity: 0; transform: translateY(-120px) scale(1.5) rotate(45deg); }
}
@keyframes crawlDown {
  0% { opacity: 1; transform: translateY(-20px) scale(1); }
  100% { opacity: 0; transform: translateY(120px) scale(0.5); }
}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand"><div class="logo">CH</div><span>CinderHex <span style="color:var(--accent2)">Code Vault</span></span></div>
  <a href="https://www.youtube.com/@CinderHex_YT" target="_blank"><button class="primary">YouTube</button></a>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Creator tools • Community codes</div>
    <h1>Find a code.<br><span>Copy. Create.</span></h1>
    <p>A clean, static vault for CinderHex codes. Search the collection, copy an API script with one click, and drop it straight into Bloxd.io.</p>
    <div class="toolbar">
      <input id="search" class="field search" type="search" placeholder="Search codes, titles, or categories…" aria-label="Search codes">
      <select id="categoryFilter" class="field" aria-label="Filter by category"><option value="">All categories</option></select>
    </div>
    <div class="pills"><span class="pill" id="codeTotal">0 codes</span><span class="pill">One-click copy</span><span class="pill">Secure</span></div>
  </section>
  <section id="codeGrid" class="grid" aria-live="polite"></section>
</main>
<footer><div class="wrap">CinderHex Code Vault · Static Secure Edition.</div></footer>

<div id="toast" class="toast hidden" role="status"></div>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  let toastTimer;

  // --------------------------------------------------------
  // THE VAULT DATABASE
  // Add new scripts directly to this array.
  // --------------------------------------------------------
  const codes = [
    {
      id: "blub-entity-script",
      title: "Blub Bacteria Mob",
      category: "Custom Entities",
      description: "A custom tameable bacteria mob. Drop rocks to spawn, use glowing mushrooms to tame. Features idle, follow, flee, and custom death animations.",
      code: `// WORLD
var parts = [
  [{"blockName":"Cyan Glass","size":[0.75,0.75,1]},[-0.0025,0.25,-0.1225],[0,0,0],"BloxdBlock"],
  [{"blockName":"Ice","size":[0.7,0.7,0.95]},[-0.0075,0.265,-0.1225],[0,0,0],"BloxdBlock"],
  [{"blockName":"Black Concrete","size":[0.14,0.04,0.26]},[-0.1725,0.58,-0.4975],[0,0,0],"BloxdBlock"],
  [{"blockName":"Black Concrete","size":[0.14,0.04,0.26]},[0.1675,0.58,-0.4975],[0,0,0],"BloxdBlock"],
  [{"blockName":"Black Concrete","size":[0.14,0.04,0.26]},[-0.0125,0.48,-0.4975],[0,0,0],"BloxdBlock"],
  [{"blockName":"Ice","size":[0.25,0.25,0.25]},[0.2525,0,-0.3725],[0,0,0],"BloxdBlock"],
  [{"blockName":"Ice","size":[0.25,0.25,0.25]},[-0.2475,0,-0.3725],[0,0,0],"BloxdBlock"],
  [{"blockName":"Ice","size":[0.25,0.25,0.25]},[-0.2475,0,0.1275],[0,0,0],"BloxdBlock"],
  [{"blockName":"Ice","size":[0.25,0.25,0.25]},[0.2525,0,0.1275],[0,0,0],"BloxdBlock"],
  [{"blockName":"Ice","size":[0.27,0.5,0.25]},[0.1275,1,-0.2475],[0,0,0],"BloxdBlock"],
  [{"blockName":"Ice","size":[0.25,0.5,0.25]},[-0.1725,1,-0.2475],[0,0,0],"BloxdBlock"],
  [{"blockName":"Block of Lapis Lazuli","size":[0.15,0.4,0.02]},[0.1275,1.05,-0.3825],[0,0,0],"BloxdBlock"],
  [{"blockName":"Block of Lapis Lazuli","size":[0.15,0.4,0.02]},[-0.1725,1.05,-0.3825],[0,0,0],"BloxdBlock"],
  [{"blockName":"Ice","size":[0.25,0.25,0.25]},[0.0025,0.5,0.5025],[0,0,0],"BloxdBlock"]
];

var activeBlubs = [];
var lastTickTime = Date.now();
var clickDebounce = {};

function spawnBlub(id, cx, cy, cz) {
  var created = [];
  try {
    for (var i = 0; i < parts.length; i++) {
      var opts = Object.assign({ pointable: true }, parts[i][0]);
      var meshId = api.attemptCreateMeshEntity(parts[i][3] || "Box", opts);
      if (meshId) created.push(meshId);
    }
    
    var groundY = cy;
    for (var y = Math.floor(cy) + 5; y >= Math.floor(cy) - 24; y--) {
      try {
        var b = api.getBlock(Math.floor(cx), y, Math.floor(cz));
        if (b && b !== "Air" && b !== "Water" && b !== "Lava") {
          groundY = y + 1;
          break;
        }
      } catch(e) {}
    }

    activeBlubs.push({
      ids: created,
      hp: 3,
      state: "patrol",
      owner: null,
      nameTagId: null,
      cx: cx,
      cz: cz,
      curX: cx,
      curZ: cz,
      cy: groundY,
      fleeDir: [0, 1],
      fleeTimer: 0,
      flashUntil: 0,
      isFlashing: false,
      facingAngle: 0,
      animCycle: 0,
      deathTime: 0,
      start: Date.now()
    });
    
    if (typeof api.playClientSound === "function") {
      api.playClientSound(id, "levelup", 1.0, 1.2);
    }
    api.sendMessage(id, "A wild Blub spawned!", {color: "lime"});
  } catch (e) {
    api.sendMessage(id, "Hit mesh limit.", {color: "red"});
  }
}

function isRock(item) {
  if (!item) return false;
  var name = typeof item === "string" ? item : (item.name || "");
  var low = name.toLowerCase();
  return low === "stone" || low === "cobblestone" || low === "gravel";
}

onPlayerDropItem = (id, x, y, z, item, amount, slot) => {
  if (isRock(item)) {
    spawnBlub(id, x, y, z);
    try { api.removeItemName(id, typeof item === "string" ? item : item.name, 1); } catch(e) {}
    return "preventDrop"; 
  }
};

onPlayerChat = (id, msg) => {
  var low = (msg || "").trim().toLowerCase();
  
  if (low === "!blub") {
    var pos = api.getPosition(id);
    if (!pos) return;
    
    var look = api.getPlayerFacingInfo(id);
    var dir = (look && look.dir) ? look.dir : [0, 0, -1];
    var len = Math.hypot(dir[0], dir[2]);
    var dx = len > 0.01 ? dir[0] / len : 0;
    var dz = len > 0.01 ? dir[2] / len : 1;

    var cx = pos[0] + dx * 4;
    var cz = pos[2] + dz * 4;
    
    spawnBlub(id, cx, pos[1], cz);
    return "preventChat";
  }

  if (low === "!clearblubs") {
    for (var b = 0; b < activeBlubs.length; b++) {
      for (var i = 0; i < activeBlubs[b].ids.length; i++) {
        var mId = activeBlubs[b].ids[i];
        try { api.removeMeshEntity(mId); } catch(e) {}
        try { api.deleteMeshEntity(mId); } catch(e) {}
        try { api.destroyEntity(mId); } catch(e) {}
      }
      if (activeBlubs[b].nameTagId) {
        try { api.removeMeshEntity(activeBlubs[b].nameTagId); } catch(e) {}
      }
    }
    activeBlubs = [];
    api.sendMessage(id, "Cleared all Blubs.", {color: "lime"});
    return "preventChat";
  }
};

function tryHitBlub(id, targetEId, tx, ty, tz, isAltAction) {
  var now = Date.now();
  if (now - (clickDebounce[id] || 0) < 200) return;
  clickDebounce[id] = now;

  var hitIdx = -1;

  if (targetEId) {
    for (var b = 0; b < activeBlubs.length; b++) {
      if (activeBlubs[b].ids.indexOf(targetEId) !== -1 || activeBlubs[b].nameTagId === targetEId) {
        hitIdx = b;
        break;
      }
    }
  }

  if (hitIdx === -1) {
    var pPos = api.getPosition(id);
    var look = api.getPlayerFacingInfo(id);
    
    if (pPos && look && look.dir) {
      var camX = (look.camPos || pPos)[0];
      var camY = (look.camPos || pPos)[1];
      if (!look.camPos) camY += 1.5; 
      var camZ = (look.camPos || pPos)[2];

      for (var step = 0; step <= 4; step += 0.5) {
        var hx = camX + look.dir[0] * step;
        var hy = camY + look.dir[1] * step;
        var hz = camZ + look.dir[2] * step;

        for (var idx = 0; idx < activeBlubs.length; idx++) {
          var blubCheck = activeBlubs[idx];
          var dist = Math.sqrt(
            Math.pow(hx - blubCheck.curX, 2) + 
            Math.pow(hy - (blubCheck.cy + 0.5), 2) + 
            Math.pow(hz - blubCheck.curZ, 2)
          );
          if (dist <= 1.2) {
            hitIdx = idx;
            break;
          }
        }
        if (hitIdx !== -1) break;
      }
    }
  }

  if (hitIdx !== -1) {
    var blub = activeBlubs[hitIdx];
    if (blub.state === "dying") return;

    var held = api.getHeldItem(id);
    var heldName = held ? (typeof held === "string" ? held : (held.name || "")) : "";

    // --- TAMING LOGIC ---
    if (isAltAction && heldName.toLowerCase() === "glowing mushroom") {
      if (blub.owner !== id) {
        blub.owner = id;
        blub.state = "follow";
        blub.hp = 3; 
        
        var playerName = api.getEntityName(id) || "Player";

        try {
          api.playParticleEffect({
            pos1: [blub.curX - 0.5, blub.cy + 0.5, blub.curZ - 0.5],
            pos2: [blub.curX + 0.5, blub.cy + 1.5, blub.curZ + 0.5],
            texture: "glint",
            minLifeTime: 0.5, maxLifeTime: 1.2,
            minSize: 0.4, maxSize: 0.7,
            minEmitPower: 1.0, maxEmitPower: 3.0,
            manualEmitCount: 25,
            dir1: [-1.0, 0.5, -1.0],
            dir2: [1.0, 2.5, 1.0],
            gravity: [0, -1.5, 0],
            velocityGradients: [{timeFraction: 0, factor: 1, factor2: 1}],
            colorGradients: [{timeFraction: 0, minColor: [255, 50, 100, 1], maxColor: [255, 120, 150, 1]}],
            blendMode: 1
          });
          if (typeof api.playClientSound === "function") {
            api.playClientSound(id, "orb", 1.0, 1.5);
          }
        } catch(e) {}

        if (blub.nameTagId) {
          try { api.removeMeshEntity(blub.nameTagId); } catch(e) {}
        }
        try {
          blub.nameTagId = api.attemptCreateMeshEntity("Text", { text: playerName + "'s Blub", size: 0.8, color: "cyan" });
        } catch(e) {}

        try { api.removeItemName(id, typeof held === "string" ? held : held.name, 1); } catch(e) {}
        api.sendMessage(id, "You tamed a Blub!", {color: "lime"});
      }
      return;
    }

    // --- DAMAGE LOGIC ---
    blub.hp--;
    blub.flashUntil = Date.now() + 250;

    var actPos = api.getPosition(id);
    if (actPos) {
      var dx = blub.curX - actPos[0];
      var dz = blub.curZ - actPos[2];
      var len = Math.hypot(dx, dz);
      if (len > 0) {
        blub.fleeDir = [dx / len, dz / len];
      }
    }

    if (blub.hp <= 0) {
      blub.state = "dying";
      blub.deathTime = Date.now();

      try {
        api.sendFlyingMiddleMessage(id, [{str: "your a heartless monster", style: {color: "red", fontWeight: "bold", fontSize: "28px"}}], 45);
      } catch(e) {}
      try {
        if (typeof api.playClientSound === "function") api.playClientSound(id, "bass", 1.0, 0.7);
      } catch(e) {}

    } else {
      if (blub.state !== "flee") {
        blub.cx = blub.curX;
        blub.cz = blub.curZ;
      }
      blub.state = "flee";
      blub.fleeTimer = Date.now() + 2500;
      
      try {
        api.playParticleEffect({
          pos1: [blub.curX - 0.4, blub.cy + 0.2, blub.curZ - 0.4],
          pos2: [blub.curX + 0.4, blub.cy + 0.8, blub.curZ + 0.4],
          texture: "glint",
          minLifeTime: 0.2, maxLifeTime: 0.5,
          minSize: 0.2, maxSize: 0.4,
          minEmitPower: 1, maxEmitPower: 2,
          manualEmitCount: 10,
          dir1: [-0.5, 0.5, -0.5],
          dir2: [0.5, 1.5, 0.5],
          gravity: [0, -1.5, 0],
          velocityGradients: [{timeFraction: 0, factor: 1, factor2: 1}],
          colorGradients: [{timeFraction: 0, minColor: [255, 50, 50, 1], maxColor: [255, 100, 100, 1]}],
          blendMode: 1
        });
        if (typeof api.playClientSound === "function") {
          api.playClientSound(id, "hit", 1.0, 1.3);
        }
      } catch(e) {}
    }
  } else {
    var held = api.getHeldItem(id);
    if (isRock(held) && !isAltAction) {
      if (typeof tx === "number") {
        spawnBlub(id, tx, ty + 1, tz);
        try { api.removeItemName(id, typeof held === "string" ? held : held.name, 1); } catch(e) {}
      }
    }
  }
}

onPlayerClick = (id, alt, x, y, z, block, targetEId) => { tryHitBlub(id, targetEId, x, y, z, alt); };
onPlayerAltAction = (id, x, y, z, block, targetEId) => { tryHitBlub(id, targetEId, x, y, z, true); };
onPlayerAttemptAltAction = (id, x, y, z, block, targetEId) => { tryHitBlub(id, targetEId, x, y, z, true); };

tick = (dt) => {
  var now = Date.now();
  var dtSec = (now - lastTickTime) / 1000;
  if (dtSec > 0.1) dtSec = 0.1;
  lastTickTime = now;

  for (var b = activeBlubs.length - 1; b >= 0; b--) {
    var blub = activeBlubs[b];
    var t = (now - blub.start) / 1000;

    var shouldFlash = now < blub.flashUntil;
    if (shouldFlash && !blub.isFlashing) {
      blub.isFlashing = true;
      for (var i = 0; i < parts.length; i++) {
        if (!blub.ids[i]) continue;
        var opts = Object.assign({ pointable: true }, parts[i][0], { blockName: "Red Concrete" });
        try { api.updateMeshEntity(blub.ids[i], parts[i][3] || "Box", opts); } catch(e) {}
      }
    } else if (!shouldFlash && blub.isFlashing) {
      blub.isFlashing = false;
      for (var i = 0; i < parts.length; i++) {
        if (!blub.ids[i]) continue;
        var opts = Object.assign({ pointable: true }, parts[i][0]);
        try { api.updateMeshEntity(blub.ids[i], parts[i][3] || "Box", opts); } catch(e) {}
      }
    }

    if (blub.state === "dying") {
      var dT = (now - blub.deathTime) / 1000;
      var deathDur = 1.4; 

      if (dT >= deathDur) {
        try {
          api.playParticleEffect({
            pos1: [blub.curX - 0.8, blub.cy, blub.curZ - 0.8],
            pos2: [blub.curX + 0.8, blub.cy + 1.5, blub.curZ + 0.8],
            texture: "drift",
            minLifeTime: 0.6, maxLifeTime: 1.2,
            minSize: 0.6, maxSize: 1.2,
            minEmitPower: 0.5, maxEmitPower: 1.5,
            manualEmitCount: 60,
            dir1: [-1.0, 0.0, -1.0],
            dir2: [1.0, 2.0, 1.0],
            gravity: [0, 0, 0],
            velocityGradients: [{timeFraction: 0, factor: 1, factor2: 1}],
            colorGradients: [{timeFraction: 0, minColor: [100, 100, 100, 1], maxColor: [180, 180, 180, 1]}],
            blendMode: 1
          });
          if (typeof api.playClientSound === "function") {
            api.playClientSound(null, "fizz", 1.0, 0.5);
          }
        } catch(e) {}

        for (var i = 0; i < blub.ids.length; i++) {
          var mId = blub.ids[i];
          try { api.setPosition(mId, 0, -5000, 0); } catch(e) {}
          try { api.updateMeshEntity(mId, parts[i][3] || "Box", { size: 0.001, pointable: false }); } catch(e) {}
          try { api.removeMeshEntity(mId); } catch(e) {}
          try { api.destroyEntity(mId); } catch(e) {}
        }
        
        if (blub.nameTagId) {
          try { api.setPosition(blub.nameTagId, 0, -5000, 0); } catch(e) {}
          try { api.removeMeshEntity(blub.nameTagId); } catch(e) {}
        }
        
        activeBlubs.splice(b, 1);
        continue;
      }

      var tiltProg = Math.min(1.0, dT / (deathDur * 0.7)); 
      var tiltAngle = tiltProg * (Math.PI / 2); 
      var cosT = Math.cos(tiltAngle);
      var sinT = Math.sin(tiltAngle);
      var cosA = Math.cos(blub.facingAngle || 0);
      var sinA = Math.sin(blub.facingAngle || 0);

      for (var i = 0; i < parts.length; i++) {
        if (!blub.ids[i]) continue;
        var mId = blub.ids[i];
        var baseP = parts[i][1];
        var baseR = parts[i][2];

        var lx = baseP[0], ly = baseP[1], lz = baseP[2];
        var rx = baseR[0], ry = baseR[1], rz = baseR[2];

        var pivotY = 0.25; 
        var shiftedY = ly - pivotY;

        var newLocalX = lx * cosT + shiftedY * sinT;
        var newLocalY = -lx * sinT + shiftedY * cosT;
        newLocalY += pivotY; 

        if (tiltProg === 1.0) {
            var sinkProg = Math.min(1.0, (dT - (deathDur * 0.7)) / (deathDur * 0.3));
            newLocalY -= (sinkProg * 0.15); 
        }

        var rotX = newLocalX * cosA + lz * sinA;
        var rotZ = -newLocalX * sinA + lz * cosA;

        try {
          api.setPosition(mId, blub.curX + rotX, blub.cy + newLocalY, blub.curZ + rotZ);
          api.setEntityRotation(mId, rx, ry + (blub.facingAngle || 0), rz - tiltAngle);
        } catch(e) {}
      }
      
      if (blub.nameTagId) {
        try { 
          api.setPosition(blub.nameTagId, blub.curX, blub.cy + 1.6 - (tiltProg * 0.5), blub.curZ); 
          api.setEntityRotation(blub.nameTagId, 0, (blub.facingAngle || 0), 0);
        } catch(e) {}
      }
      continue; 
    }

    var gY = blub.cy;
    for (var y = Math.floor(blub.cy) + 2; y >= Math.floor(blub.cy) - 5; y--) {
      try {
        var block = api.getBlock(Math.floor(blub.curX), y, Math.floor(blub.curZ));
        if (block && block !== "Air" && block !== "Water" && block !== "Lava") {
          gY = y + 1;
          break;
        }
      } catch(e) {}
    }
    blub.cy += (gY - blub.cy) * 0.15;

    var angle, walkCycle;

    if (blub.state === "flee") {
      if (now > blub.fleeTimer) {
        blub.state = blub.owner ? "follow" : "patrol";
        blub.start = now; 
      } else {
        var fleeSpeed = 5.5;
        blub.cx += blub.fleeDir[0] * fleeSpeed * dtSec;
        blub.cz += blub.fleeDir[1] * fleeSpeed * dtSec;
        blub.curX = blub.cx;
        blub.curZ = blub.cz;
        
        angle = Math.atan2(blub.fleeDir[0], blub.fleeDir[1]) + Math.PI; 
        blub.animCycle += fleeSpeed * 6 * dtSec;
        walkCycle = blub.animCycle;
      }
    } else if (blub.state === "follow") {
      var speed = 3.5;
      var ownerPos = api.getPosition(blub.owner);
      
      if (ownerPos) {
        var dx = ownerPos[0] - blub.curX;
        var dz = ownerPos[2] - blub.curZ;
        var dist = Math.hypot(dx, dz);

        if (dist > 2.5) {
          if (dist > 10) speed = 6.5; 
          blub.cx += (dx / dist) * speed * dtSec;
          blub.cz += (dz / dist) * speed * dtSec;
          angle = Math.atan2(dx, dz) + Math.PI;
          blub.curX = blub.cx;
          blub.curZ = blub.cz;
          blub.animCycle += speed * 6 * dtSec;
          walkCycle = blub.animCycle;
        } else {
          angle = Math.atan2(dx, dz) + Math.PI;
          blub.animCycle = 0;
          walkCycle = 0;
        }
      } else {
        blub.state = "patrol";
        walkCycle = 0;
        angle = blub.facingAngle || 0;
      }
    } else if (blub.state === "patrol") {
      var pSpeed = 1.2;
      var pRadius = 3.5;
      var offsetX = Math.sin(t * pSpeed) * pRadius;
      var offsetZ = Math.sin(t * pSpeed * 0.5) * pRadius * 2;
      var velX = Math.cos(t * pSpeed) * pRadius * pSpeed;
      var velZ = Math.cos(t * pSpeed * 0.5) * pRadius * pSpeed;

      blub.curX = blub.cx + offsetX;
      blub.curZ = blub.cz + offsetZ;
      angle = Math.atan2(velX, velZ) + Math.PI; 
      blub.animCycle = t * pSpeed * 6;
      walkCycle = blub.animCycle;
    }

    blub.facingAngle = angle;

    var cosA = Math.cos(angle);
    var sinA = Math.sin(angle);

    var swing = Math.sin(walkCycle) * 0.25;
    var bob = Math.abs(Math.sin(walkCycle)) * 0.12;
    var tailWag = Math.sin(walkCycle * 1.5) * 0.5;

    for (var i = 0; i < parts.length; i++) {
      if (!blub.ids[i]) continue;
      var mId = blub.ids[i];
      var baseP = parts[i][1];
      var baseR = parts[i][2];

      var lx = baseP[0], ly = baseP[1], lz = baseP[2];
      var rx = baseR[0], ry = baseR[1], rz = baseR[2];

      if (i === 5 || i === 7) {
        lz += swing; 
        rx += swing;
      } else if (i === 6 || i === 8) {
        lz -= swing; 
        rx -= swing;
      } else if (i === 13) {
        ly += bob; 
        ry += tailWag;
      } else {
        ly += bob;
      }

      var rotX = lx * cosA + lz * sinA;
      var rotZ = -lx * sinA + lz * cosA;

      try {
        api.setPosition(mId, blub.curX + rotX, blub.cy + ly, blub.curZ + rotZ);
        api.setEntityRotation(mId, rx, ry + angle, rz);
      } catch(e) {}
    }
    
    if (blub.nameTagId) {
      try { 
        api.setPosition(blub.nameTagId, blub.curX, blub.cy + 1.6, blub.curZ); 
        api.setEntityRotation(blub.nameTagId, 0, angle, 0);
      } catch(e) {}
    }
  }
};`
    }
  ];

  function esc(value){ return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
  
  function notify(message){
    $("toast").textContent = message; $("toast").classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 2400);
  }
  
  function spawnParticles(x, y, emoji, count, animName) {
    for(let i=0; i<count; i++) {
        const el = document.createElement('div');
        el.textContent = emoji;
        el.className = 'particle';
        el.style.left = (x + (Math.random() * 40 - 20)) + 'px';
        el.style.top = (y + (Math.random() * 40 - 20)) + 'px';
        el.style.animationName = `${animName} 1.5s forwards`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
    }
  }

  function triggerCopyAnimation(title, buttonElement) {
    const t = title.toLowerCase();
    const rect = buttonElement.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top;

    if (t.includes('lightning') || t.includes('thunder')) {
        document.body.classList.add('anim-flash', 'anim-shake');
        setTimeout(() => document.body.classList.remove('anim-flash', 'anim-shake'), 400);
    } else if (t.includes('spooder')) {
        spawnParticles(x, y, '🕷️', 8, 'crawlDown');
    } else if (t.includes('blub') || t.includes('water')) {
        spawnParticles(x, y, '💧', 6, 'floatUp');
    } else if (t.includes('time')) {
        spawnParticles(x, y, '⏳', 4, 'floatUp');
    } else if (t.includes('explosion') || t.includes('trident') || t.includes('golem')) {
        document.body.classList.add('anim-shake');
        setTimeout(() => document.body.classList.remove('anim-shake'), 300);
        spawnParticles(x, y, '💥', 5, 'floatUp');
    } else {
        spawnParticles(x, y, '✨', 5, 'floatUp');
    }
  }

  function updateCategories(){
    const select = $("categoryFilter"), current = select.value;
    const categories = [...new Set(codes.map(c => String(c.category || "Other").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    select.innerHTML = '<option value="">All categories</option>' + categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
    if(categories.includes(current)) select.value=current;
  }

  function render(){
    updateCategories();
    const term = $("search").value.trim().toLowerCase(), cat = $("categoryFilter").value;
    const filtered = codes.filter(c => (!cat || c.category === cat) && (!term || [c.title,c.category,c.description,c.code].some(v=>String(v||"").toLowerCase().includes(term))));
    $("codeTotal").textContent = `${codes.length} code${codes.length===1?"":"s"}`;
    const grid = $("codeGrid");
    if(!filtered.length){grid.innerHTML='<div class="empty">No codes found.</div>';return;}
    grid.innerHTML = filtered.map(c => `
      <article class="code-card">
        <div class="card-top"><div><h2>${esc(c.title)}</h2><div class="category">${esc(c.category || "Other")}</div></div></div>
        <p class="description">${esc(c.description || "No description provided.")}</p>
        <div class="code-box" id="code-${esc(c.id)}">${esc(c.code)}</div>
        <div class="card-bottom"><span class="count"></span><button class="primary" data-copy="${esc(c.id)}"><span aria-hidden="true">▢</span> Copy code</button></div>
      </article>`).join("");
  }

  async function copyCode(id, buttonElement){
    const c = codes.find(item => item.id === id); if(!c) return;
    let success = false;
    try {
      await navigator.clipboard.writeText(c.code);
      success = true;
    } catch {
      const area = document.createElement("textarea");
      area.value = c.code; area.style.position="fixed"; area.style.opacity="0"; area.setAttribute("readonly","");
      document.body.appendChild(area); area.select();
      try { success = document.execCommand("copy"); } catch {}
      area.remove();
    }
    if(!success){ notify("Copy was blocked by the browser. Select the code and copy it manually."); return; }
    
    triggerCopyAnimation(c.title, buttonElement);
    notify("Code copied!");
  }

  $("codeGrid").addEventListener("click",event=>{
    const copy=event.target.closest("[data-copy]");
    if(copy) copyCode(copy.dataset.copy, copy);
  });

  $("search").addEventListener("input",render); $("categoryFilter").addEventListener("change",render);
  
  // Initial Load
  render();
})();
</script>
</body>
</html>
