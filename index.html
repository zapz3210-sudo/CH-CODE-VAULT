<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CinderHex Code Vault</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0c12;--panel:#111622;--panel2:#171e2d;--line:#273247;--text:#f4f7ff;--muted:#a5b1c7;--accent:#ff623f;--accent2:#ff9a54}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2132 0%,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
header{border-bottom:1px solid var(--line);background:#0b0e16d9;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.wrap{width:min(1080px,calc(100% - 32px));margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.2px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ffb05c);color:#1a1010;font-weight:1000;font-size:21px}
button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer;transition:transform .12s,border-color .12s}button:hover{border-color:#ff896f;transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#1b1010}.quiet{background:transparent}
.hero{padding:30px 0 20px;text-align:center;}.hero h1{font-size:clamp(28px,5vw,46px);margin:10px 0}.hero p{color:var(--muted);margin:0 auto 20px;max-width:600px}
.toolbar{display:flex;gap:12px;justify-content:center;margin-bottom:30px}.field{background:#0e1320;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:12px;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;padding-bottom:48px}
.code-card{background:linear-gradient(145deg,#151c2a,#101520);border:1px solid var(--line);border-radius:16px;padding:20px;height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:transform 0.1s}
.code-card h2{font-size:18px;margin:0 0 10px;color:#fff}
.category{font-size:12px;color:var(--accent2);font-weight:800;text-transform:uppercase;margin-bottom:auto}
.copy-btn{width:100%;margin-top:15px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eafbf3;color:#10261d;border-radius:999px;padding:11px 17px;font-weight:800;box-shadow:0 8px 35px #0007;z-index:20;transition:opacity 0.3s}
.hidden{display:none!important;opacity:0;pointer-events:none}
.auth-panel{background:var(--panel2);border:1px solid var(--line);border-radius:17px;max-width:350px;margin:60px auto;padding:30px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.auth-panel input{width:100%;margin-bottom:15px}.auth-panel .inline-actions{display:flex;gap:10px;justify-content:center}
.particle{position:fixed;pointer-events:none;z-index:9999;font-size:24px}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}100%{opacity:0;transform:translateY(-120px) scale(1.5) rotate(45deg)}}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand"><div class="logo">CH</div><span>CinderHex <span style="color:var(--accent2)">Code Vault</span></span></div>
  <button id="authBtn" class="primary hidden">Log Out</button>
</div></header>

<main class="wrap">
  <div id="authSection" class="auth-panel">
    <h2 style="margin-top:0;color:var(--accent2)">Vault Login</h2>
    <input type="email" id="emailInput" class="field" placeholder="Email Address" required>
    <input type="password" id="passwordInput" class="field" placeholder="Password" required>
    <div class="inline-actions"><button class="quiet" id="signUpBtn">Sign Up</button><button class="primary" id="logInBtn">Log In</button></div>
  </div>

  <div id="vaultMain" class="hidden">
    <section class="hero">
      <h1>CinderHex <span>Arsenal</span></h1>
      <p>Secure Bloxd.io script vault. Click any square to instantly copy the code.</p>
      <div class="toolbar">
        <input id="search" class="field" type="search" placeholder="Search scripts...">
        <select id="categoryFilter" class="field"><option value="">All Categories</option></select>
      </div>
    </section>
    <section id="codeGrid" class="grid"></section>
  </div>
</main>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  let toastTimer;

  const supabaseUrl = 'YOUR_SUPABASE_URL_HERE';
  const supabaseKey = 'sb_publishable_PhE6B6xWU_Ozir2vZ_aoMQ_68-fqo2n';
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  const codes = [

    { id: "floor", title: "The Floor Is Lying", category: "Game Modes", code: "function checkFloor(p) { if(p.standingOn == 'Maple Wood Planks') { dropPlayer(p); } }" },
    { id: "gauntlet", title: "Gauntlet Wars", category: "Game Modes", code: "let teams = ['Red', 'Blue']; function initBases() { spawnCyberdome(); spawnMagmaCore(); }" },
    { id: "touch", title: "Don't Touch The Line", category: "Game Modes", code: "let bounds = 80; function shrinkArena() { bounds -= 1; killOutsideBounds(bounds); }" }
  ];

  function notify(msg){ $("toast").textContent=msg; $("toast").classList.remove("hidden"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$("toast").classList.add("hidden"), 2000); }

  async function checkUser() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) { $("authSection").classList.add("hidden"); $("vaultMain").classList.remove("hidden"); $("authBtn").classList.remove("hidden"); render(); }
    else { $("authSection").classList.remove("hidden"); $("vaultMain").classList.add("hidden"); $("authBtn").classList.add("hidden"); }
  }

  $("signUpBtn").onclick = async () => {
    const { error } = await supabase.auth.signUp({ email: $("emailInput").value, password: $("passwordInput").value });
    error ? notify(error.message) : notify("Account created! You can now log in.");
  };

  $("logInBtn").onclick = async () => {
    const { error } = await supabase.auth.signInWithPassword({ email: $("emailInput").value, password: $("passwordInput").value });
    error ? notify(error.message) : checkUser();
  };

  $("authBtn").onclick = async () => { await supabase.auth.signOut(); checkUser(); notify("Logged out."); };

  function spawnParticles(x, y) {
    for(let i=0; i<5; i++) {
        const el = document.createElement('div'); el.textContent = '✨'; el.className = 'particle';
        el.style.left = (x + (Math.random()*40-20))+'px'; el.style.top = (y + (Math.random()*40-20))+'px';
        el.style.animation = 'floatUp 1.5s forwards'; document.body.appendChild(el); setTimeout(()=>el.remove(), 1500);
    }
  }

  function render(){
    const term = $("search").value.toLowerCase(), cat = $("categoryFilter").value;
    const cats = [...new Set(codes.map(c=>c.category))];
    $("categoryFilter").innerHTML = '<option value="">All Categories</option>' + cats.map(c=>`<option value="${c}">${c}</option>`).join("");
    $("categoryFilter").value = cat;

    const filtered = codes.filter(c => (!cat || c.category === cat) && (!term || c.title.toLowerCase().includes(term)));
    $("codeGrid").innerHTML = filtered.map(c => `
      <article class="code-card">
        <div class="category">${c.category}</div>
        <h2>${c.title}</h2>
        <button class="primary copy-btn" data-copy="${c.id}">Copy Code</button>
      </article>`).join("");
  }

  $("codeGrid").onclick = async (e) => {
    const btn = e.target.closest("[data-copy]"); if(!btn) return;
    const c = codes.find(x => x.id === btn.dataset.copy);
    await navigator.clipboard.writeText(c.code);
    const r = btn.getBoundingClientRect(); spawnParticles(r.left + r.width/2, r.top);
    notify(c.title + " copied!");
  };

  $("search").oninput = render; $("categoryFilter").onchange = render;
  checkUser();
})();
</script>
</body>
</html>
